# 베트맨 승부식 배당 자동 수집 → data/odds.json 커밋.
# 앱은 Supabase 미설정 시 listOdds() 로 이 파일을 읽어 화면에 배당을 표시한다.
#
# 소스 전략: 베트맨(우선) → The Odds API(폴백). 자세한 건 scripts/fetch-odds.ts 주석 참고.
#
# 러너 선택(중요):
#  - github-hosted(ubuntu-latest): 데이터센터 IP 라 베트맨은 대개 차단됨 → The Odds API 가 백본.
#  - self-hosted(사용자 집 PC, residential IP): 베트맨 실제 배당까지 수집 가능.
#    집 러너를 쓰려면 runs-on 을 [self-hosted] 로 바꾸고 ENABLE_BETMAN_SCRAPER=true 로 둔다.
name: collect-odds

on:
  schedule:
    - cron: '0 */6 * * *' # 6시간마다 (UTC). 무료 The Odds API 월 500회 내(월 ~120회).
  workflow_dispatch: # 수동 실행 버튼

# data/odds.json 커밋을 위해 쓰기 권한 필요.
permissions:
  contents: write

# 동시 실행 방지(이전 실행과 겹치면 취소).
concurrency:
  group: collect-odds
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 배당 수집 (베트맨 → The Odds API)
        env:
          # github-hosted 에서는 베트맨이 차단되므로 기본 false. self-hosted 면 true 로.
          ENABLE_BETMAN_SCRAPER: ${{ vars.ENABLE_BETMAN_SCRAPER || 'false' }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          # 경기 일정/팀명 소스(선택). 없으면 openfootball 정적 일정 사용.
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: npm run odds
      - name: 변경 시에만 커밋·푸시
        run: |
          if git diff --quiet -- data/odds.json; then
            echo "배당 변동 없음 — 커밋 생략"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/odds.json
            git commit -m "chore(odds): 베트맨/배당 자동 갱신"
            git push
          fi
