<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>베트맨 배당 수집기 설정</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #111; }
      h1 { font-size: 18px; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; }
      input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font: inherit; }
      textarea { min-height: 64px; }
      .hint { color: #666; font-size: 12px; margin-top: 4px; }
      button { margin-top: 18px; padding: 10px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
      #msg { margin-left: 10px; color: #16a34a; }
    </style>
  </head>
  <body>
    <h1>베트맨 배당 수집기 설정</h1>

    <label for="ingestUrl">앱 ingest URL</label>
    <input id="ingestUrl" placeholder="https://&lt;내앱&gt;/api/odds/ingest" />
    <div class="hint">Bet-Helper 앱의 수집 엔드포인트.</div>

    <label for="ingestToken">ingest 토큰</label>
    <input id="ingestToken" type="password" placeholder="ODDS_INGEST_TOKEN 값" />
    <div class="hint">앱 환경변수 <code>ODDS_INGEST_TOKEN</code> 과 동일한 값.</div>

    <label for="slipApiUrl">베트맨 gameSlip API URL</label>
    <input id="slipApiUrl" placeholder="https://www.betman.co.kr/.../gameSlip.do?..." />
    <div class="hint">베트맨 승부식 페이지에서 F12 → Network → gameSlip 요청의 Request URL.</div>

    <label for="slipMethod">요청 방식</label>
    <select id="slipMethod">
      <option value="GET">GET</option>
      <option value="POST">POST</option>
    </select>

    <label for="slipBody">POST 본문 (POST 일 때만)</label>
    <textarea id="slipBody" placeholder="key=value&amp;... (Network 탭의 Form Data / Payload)"></textarea>

    <label for="periodMinutes">수집 주기 (분, 최소 10)</label>
    <input id="periodMinutes" type="number" min="10" value="15" />

    <div><button id="save">저장</button><span id="msg"></span></div>

    <script src="options.js"></script>
  </body>
</html>
